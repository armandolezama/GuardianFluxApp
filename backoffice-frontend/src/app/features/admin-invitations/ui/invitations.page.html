<section class="page">
  <h2>Invitations</h2>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" placeholder="user@mail.com" />
      <mat-error *ngIf="form.controls.email.hasError('required')">Required</mat-error>
      <mat-error *ngIf="form.controls.email.hasError('email')">Invalid email</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        <mat-option *ngFor="let r of roles" [value]="r">{{ r }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Expires at</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="expiresAt" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="form.controls.expiresAt.hasError('required')">Required</mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="creating()">
      {{ creating() ? 'Creating...' : 'Create invitation' }}
    </button>
  </form>

  <div class="list">
    <div class="loading" *ngIf="loadingList()">
      <mat-spinner diameter="28"></mat-spinner>
      <span>Loading invitations...</span>
    </div>

    <table mat-table [dataSource]="invitations()" *ngIf="!loadingList()">

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}(code: {{row.code}})</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let row">{{ row.role }}</td>
      </ng-container>

      <ng-container matColumnDef="expiresAt">
        <th mat-header-cell *matHeaderCellDef>Expires</th>
        <td mat-cell *matCellDef="let row">{{ row.expiresAt | date:'medium' }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row">{{ row.status }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let row">{{ row.createdAt | date:'medium' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <p class="empty" *ngIf="!loadingList() && invitations().length === 0">
      No invitations yet.
    </p>
  </div>
</section>
